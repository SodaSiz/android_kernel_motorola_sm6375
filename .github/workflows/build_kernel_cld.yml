- name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          
          # 1. Préparation du répertoire de sortie
          mkdir -p out
          
          # 2. Fusion des configs (GKI + Holi + Bangkk + Lineage)
          make O=out ARCH=arm64 gki_defconfig
          scripts/kconfig/merge_config.sh -O out/ out/.config \
            arch/arm64/configs/vendor/holi_GKI.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-bangkk.config \
            arch/arm64/configs/vendor/ext_config/lineage_moto-holi.config

          # 3. Compilation du kernel et des modules
          make -j$(nproc --all) O=out ARCH=arm64
      
      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          # Copie des modules .ko (essentiel pour le tactile Goodix)
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;

          # Création du script anykernel.sh personnalisé
          cat <<EOF > AnyKernel3/anykernel.sh
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Kernel LineageOS GKI - Bangkk
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          device.name1=bangkk
          '; }
          . /tmp/anykernel/tools/ak3-core.sh
          split_boot;
          flash_boot;
          EOF

          cd AnyKernel3 && zip -r9 ../Bangkk-Kernel.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Bangkk
          path: Bangkk-Kernel-GKI-Goodix.zip
