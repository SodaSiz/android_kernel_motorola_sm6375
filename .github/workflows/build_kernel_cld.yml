name: Build Bangkk Kernel (GKI Android 16)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lzip libssl-dev libelf-dev clang llvm lld zip

      - name: Download Clang (AOSP)
        run: |
          mkdir clang
          cd clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522859.tar.gz
          tar -xf clang-r522859.tar.gz

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          # Utilisation de la config GKI
          make O=out gki_defconfig
          
          # Compilation
          make -j$(nproc) O=out \
                      CC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      Image.gz modules dtbo.img

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          # Collecte des modules
          mkdir -p AnyKernel3/modules
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/ \;
          
          # Génération du script anykernel.sh
          cat <<EOF > AnyKernel3/anykernel.sh
          # AnyKernel3 Setup
          properties() {
            kernel.string=Bangkk-GKI-A16
            do.devicecheck=1
            do.modules=1
            do.systemless=1
            do.cleanup=1
            device.name1=bangkk
            device.name2=g84
            supported.versions=13, 14, 15, 16
          }
          block=/dev/block/by-name/boot;
          is_slot_device=1;
          . /tmp/anykernel/tools/ak3-core.sh;
          
          ui_print "- Flashing Kernel..."
          split_boot;
          patch_cmdline "module.sig_enforce" "0"
          patch_cmdline "androidboot.selinux" "permissive"
          flash_boot;
          
          ui_print "- Flashing DTBO..."
          reset_ak;
          block=/dev/block/by-name/dtbo;
          split_dtbo;
          flash_dtbo;
          
          ui_print "- Installing Modules..."
          mount /vendor;
          cp -af /tmp/anykernel/modules/*.ko /vendor/lib/modules/;
          umount /vendor;
          EOF

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 ../Bangkk-Kernel-GKI-v1.zip * -x .git* README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bangkk-Kernel-ZIP
          path: Bangkk-Kernel-GKI-v1.zip
