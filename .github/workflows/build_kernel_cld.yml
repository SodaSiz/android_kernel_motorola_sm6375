name: Build Kernel Moto G84 (bangkk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Build Env
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison gperf libssl-dev libcrypto++-dev libncurses5-dev libncurses-dev python3-minimal zip

      - name: Setup Toolchain
        run: |
          mkdir clang
          cd clang
          # Utilisation de Proton Clang pour une meilleure compatibilité
          # curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          # À remplacer dans l'étape Setup Toolchain si besoin
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz
          tar -xf master.tar.gz
          echo "$(pwd)/proton-clang-master/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Chemins vers la toolchain
          CLANG_DIR=$(pwd)/clang/proton-clang-master
          export PATH="$CLANG_DIR/bin:$PATH"
          
          # Variables de compilation
          # On force HOSTCC et HOSTCXX sur le GCC du système pour éviter l'erreur libc
          make O=out \
               ARCH=arm64 \
               CC=clang \
               HOSTCC=gcc \
               HOSTCXX=g++ \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               vendor/holi-qgki_defconfig

          # Fusion du fragment Moto G84
          ./scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/ext_config/moto-holi-bangkk.config

          # Lancement de la compilation
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               HOSTCC=gcc \
               HOSTCXX=g++ \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip         
          # 3. Compilation
          make -j$(nproc --all) O=out

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          # Ajustement du script AnyKernel pour Motorola
          sed -i 's/device.name1=/device.name1=bangkk/g' AnyKernel3/anykernel.sh
          sed -i 's/block=/block=\/dev\/block\/bootdevice\/by-name\/boot/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-Moto-G84.zip *

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Flashable-G84
          path: Kernel-Moto-G84.zip
