name: Build Bangkk Kernel GKI
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev zip

      - name: Download Clang Toolchain
        run: |
          mkdir clang
          # Utilisation de Proton Clang (très stable pour les kernels Android)
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz -C clang --strip-components=1

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          
          # 1. Préparation
          mkdir -p out
          
          # 2. Fusion des configs (Vérifie bien que les chemins sont exacts dans ton repo)
          make O=out ARCH=arm64 gki_defconfig
          
          ./scripts/kconfig/merge_config.sh -O out/ out/.config \
            arch/arm64/configs/vendor/holi_GKI.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-bangkk.config \
            arch/arm64/configs/vendor/ext_config/lineage_moto-holi.config

          # 3. Compilation
          # On limite à -j$(nproc) pour éviter les plantages RAM sur GitHub
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          # Copie des modules (indispensable pour le tactile Goodix)
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;
          
          # Création du script d'installation
          cat <<EOF > AnyKernel3/anykernel.sh
          # AnyKernel3 Setup
          properties() { '
          kernel.string=LineageOS GKI Kernel for Moto G84 (Bangkk)
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          device.name1=bangkk
          device.name2=moto g84 5G
          '; }
          . /tmp/anykernel/tools/ak3-core.sh
          split_boot;
          flash_boot;
          EOF
          
          cd AnyKernel3 && zip -r9 ../Bangkk-Kernel-GKI.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bangkk-Kernel-GKI
          path: Bangkk-Kernel-GKI.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: Bangkk-Kernel-GKI.zip
          tag_name: build-${{ github.run_number }}
          name: Kernel Bangkk GKI Build ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
