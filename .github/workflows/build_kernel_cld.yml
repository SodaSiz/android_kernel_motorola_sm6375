name: Build Bangkk Kernel (Proton Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lzip libssl-dev libelf-dev zip

      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: kernel-build-${{ github.sha }}
          restore-keys: kernel-build-

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          # Dossier de sortie
          mkdir -p out
          
          # Configuration
          make O=out gki_defconfig
          
          # Compilation GKI
          # On utilise LLVM=1 pour dire au kernel d'utiliser Clang pour tout (compiler, linker, etc.)
          make -j$(nproc) O=out \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                      Image.gz modules dtbo.img

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          
          # Copie du DTBO si généré
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          # Collecte agressive des modules (essentiel pour éviter le crash au splash screen)
          mkdir -p AnyKernel3/modules
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/ \;
          
          # Script anykernel.sh
          cat <<EOF > AnyKernel3/anykernel.sh
          properties() {
            kernel.string=Bangkk-Proton-A16
            do.devicecheck=1
            do.modules=1
            do.systemless=1
            do.cleanup=1
            device.name1=bangkk
            device.name2=g84
          }
          block=/dev/block/by-name/boot;
          is_slot_device=1;
          . /tmp/anykernel/tools/ak3-core.sh;
          
          ui_print "- Flashing Kernel..."
          split_boot;
          # Désactivation des sécurités qui font crash Android 16 non-officiel
          patch_cmdline "module.sig_enforce" "0"
          patch_cmdline "androidboot.selinux" "permissive"
          flash_boot;
          
          if [ -f /tmp/anykernel/dtbo.img ]; then
            ui_print "- Flashing DTBO..."
            reset_ak;
            block=/dev/block/by-name/dtbo;
            split_dtbo;
            flash_dtbo;
          fi
          
          ui_print "- Installing Modules..."
          mount /vendor;
          cp -af /tmp/anykernel/modules/*.ko /vendor/lib/modules/;
          umount /vendor;
          EOF

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 ../Bangkk-Kernel-GKI-v1.zip * -x .git* README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bangkk-Kernel-ZIP
          path: Bangkk-Kernel-GKI-v1.zip
