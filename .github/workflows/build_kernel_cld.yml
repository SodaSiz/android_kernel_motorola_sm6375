name: Build Bangkk Kernel GKI
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev zip

      - name: Download Clang Toolchain
        run: |
          mkdir clang
          # Proton Clang est plus flexible avec les erreurs de drivers Motorola
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz -C clang --strip-components=1
      

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          
          mkdir -p out
          
          # 1. Configuration
          make O=out ARCH=arm64 gki_defconfig
          ./scripts/kconfig/merge_config.sh -O out/ out/.config \
            arch/arm64/configs/vendor/holi_GKI.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-bangkk.config \
            arch/arm64/configs/vendor/ext_config/lineage_moto-holi.config

          # 2. Compilation
          # On retire -Wno-frame-larger-than des KCFLAGS pour éviter l'erreur de syntaxe
          # On utilise CONFIG_FRAME_WARN pour monter la limite à 4096 via la config
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-w" \
            CONFIG_FRAME_WARN=4096 \
            Image dtbs modules

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          
          # Copie de l'image kernel
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          # Copie des DTB et DTBO (Indispensable pour Bangkk)
          find out/arch/arm64/boot/dts/vendor/qcom/ -name "*.dtb" -exec cp {} AnyKernel3/ \;
          find out/arch/arm64/boot/dts/vendor/qcom/ -name "*.dtbo" -exec cp {} AnyKernel3/ \;
          
          # Copie des modules (Tactile Goodix, Audio, etc.)
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;
          
          # Création du script AnyKernel3
          cat <<EOF > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=LineageOS GKI - Bangkk (G84 5G)
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          device.name1=bangkk
          device.name2=moto g84 5G
          '; }
          . /tmp/anykernel/tools/ak3-core.sh
          split_boot;
          flash_boot;
          flash_dtbo;
          EOF
          
          cd AnyKernel3 && zip -r9 ../Bangkk-Kernel-GKI-v1.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Bangkk-ZIP
          path: Bangkk-Kernel-GKI-v1.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: Bangkk-Kernel-GKI-v1.zip
          tag_name: build-${{ github.run_number }}
          name: Bangkk Kernel GKI Build ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
