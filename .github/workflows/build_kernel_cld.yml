name: Build Bangkk Kernel Optimized

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Optimisation : ne télécharge pas tout l'historique

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lzip libssl-dev libelf-dev zip ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: kernel-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            kernel-ccache-${{ github.ref_name }}-
            kernel-ccache-

      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build Kernel
        run: |
          # Configuration des chemins
          CLANG_DIR=$(pwd)/clang
          export PATH="$CLANG_DIR/bin:/usr/lib/ccache:$PATH"
          export CCACHE_DIR=/home/runner/.ccache
          ccache -M 5G # Définit la taille du cache à 5 Go
          
          mkdir -p out
          
          # 1. Configuration (gki_defconfig)
          make O=out ARCH=arm64 gki_defconfig
          
          # 2. Compilation
          # On utilise CC="ccache clang" pour accélérer les builds futurs
          # On utilise LD=ld.lld pour corriger l'erreur de linker que vous avez reçue
          make -j$(nproc) O=out \
                      ARCH=arm64 \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      CC="ccache clang" \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                      Image.gz modules dtbo.img

      - name: Check Build Success
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "Build failed: Image.gz not found"
            exit 1
          fi

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          mkdir -p AnyKernel3/modules
          find out -name "*.ko" -exec cp {} AnyKernel3/modules/ \;
          
          # Script AnyKernel simple et efficace
          cat <<EOF > AnyKernel3/anykernel.sh
          properties() {
            kernel.string=Bangkk-GKI-Optimized
            do.devicecheck=1
            do.modules=1
            do.systemless=1
            do.cleanup=1
            device.name1=bangkk
            device.name2=g84
          }
          block=/dev/block/by-name/boot;
          is_slot_device=1;
          . /tmp/anykernel/tools/ak3-core.sh;
          split_boot;
          patch_cmdline "module.sig_enforce" "0"
          patch_cmdline "androidboot.selinux" "permissive"
          flash_boot;
          if [ -f /tmp/anykernel/dtbo.img ]; then
            reset_ak;
            block=/dev/block/by-name/dtbo;
            split_dtbo;
            flash_dtbo;
          fi
          mount /vendor;
          cp -af /tmp/anykernel/modules/*.ko /vendor/lib/modules/;
          umount /vendor;
          EOF

      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r1 ../Bangkk-Kernel-GKI.zip * # -r1 pour une compression rapide

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bangkk-Kernel-ZIP
          path: Bangkk-Kernel-GKI.zip
