name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        device: [g84_gdx] #g84_fts
    name: "🚧 Build for ${{matrix.device}}"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Europe/Paris"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install bison flex libssl-dev libarchive-tools ccache bc python3 git -y

      # =========================
      # Cache Toolchains
      # =========================
      - name: Cache Toolchains
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            toolchain/proton-clang
            toolchain/gcc64
            toolchain/gcc32
          key: ${{ runner.os }}-proton-clang-toolchain-v1

      # =========================
      # Download Proton Clang
      # =========================
      - name: Download Proton Clang
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

          # GCC 4.9 (binutils / compat Android)
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32

      # =========================
      # Cache ccache
      # =========================
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      # =========================
      # Toolchain Diagnostic
      # =========================
      - name: Toolchain Diagnostic
        run: |
          echo "=== Proton Clang ==="
          toolchain/proton-clang/bin/clang --version || exit 1

          echo "=== GCC aarch64 ==="
          toolchain/gcc64/bin/aarch64-linux-android-gcc --version || exit 1

          echo "=== GCC arm ==="
          toolchain/gcc32/bin/arm-linux-androideabi-gcc --version || exit 1

      # =========================
      # Run build
      # =========================
      - name: Run build
        run: |
          chmod +x build.sh

          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.cache/ccache

          export PATH=$PWD/toolchain/proton-clang/bin:$PATH
          export PATH=$PWD/toolchain/gcc64/bin:$PWD/toolchain/gcc32/bin:$PATH

          export CC=clang
          export CXX=clang++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          DEVICE=${{matrix.device}} ./build.sh -c

      # =========================
      # Upload
      # =========================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS_ProtonClang-${{matrix.device}}-${{ github.run_id }}
          path: "*.zip"
