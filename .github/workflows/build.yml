name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        device: [g84_gdx] #g84_fts
    name: "🚧 Build for ${{matrix.device}}"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Europe/Paris"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install bison flex libssl-dev libarchive-tools ccache bc python3 -y

      - name: Cache Toolchains
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            toolchain/clang-res
            toolchain/gcc64
            toolchain/gcc32
          key: ${{ runner.os }}-aosp-toolchain-r416155b

      - name: Download AOSP Toolchain (Single Version)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/clang-res
          
          # 1. Clone partiel avec checkout immédiat du dossier
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchain/clang-tmp
          
          # 2. Vérification et déplacement manuel (plus robuste que sparse-checkout ici)
          if [ -d "toolchain/clang-tmp/clang-r416155b" ]; then
              mv toolchain/clang-tmp/clang-r416155b/* toolchain/clang-res/
              echo "✅ Clang r416155b extrait avec succès"
          else
              echo "❌ Erreur: Dossier clang-r416155b introuvable dans le dépôt."
              ls -R toolchain/clang-tmp/ # Pour voir ce qui a été téléchargé
              exit 1
          fi
          
          # 3. Nettoyage
          rm -rf toolchain/clang-tmp
          
          # 4. Télécharger les GCC (toujours nécessaires pour les headers)
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth 1 toolchain/gcc64
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 --depth 1 toolchain/gcc32
      # Mise en cache de la compilation (ccache) pour gagner 20-30 min sur les prochains builds
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Toolchain Diagnostic
        run: |
          echo "Vérification des outils :"
          ls -d toolchain/clang-res/bin/ld.lld || echo "Clang introuvable !"
          ls -d toolchain/gcc64/bin/aarch64-linux-android-gcc || echo "GCC64 introuvable !"

      - name: Run build
        run: |
          # On s'assure que le script est exécutable
          chmod +x build.sh
          # Exécution du build
          export USE_CCACHE=1
          export CCACHE_DIR=~/.cache/ccache
          DEVICE=${{matrix.device}} ./build.sh -c

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS_AOSP-${{matrix.device}}-${{ github.run_id }}
          path: "*.zip" # Le script build.sh déplace le zip à la racine à la fin
