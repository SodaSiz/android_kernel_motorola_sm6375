name: Build GKI Kernel (bangkk / holi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      OUT_DIR: out
      LLVM: 1
      LLVM_IAS: 1
      CC: clang

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git gnupg \
            libssl-dev libelf-dev lld llvm clang \
            python3 unzip zip

      # 🔥 IMPORTANT : on ne touche PAS au source tree
      - name: Prepare output directory
        run: |
          rm -rf ${OUT_DIR}
          mkdir -p ${OUT_DIR}

      - name: Generate kernel config (GKI + holi + bangkk)
        run: |
          set -e

          # 1️⃣ Base GKI
          make O=${OUT_DIR} ARCH=${ARCH} gki_defconfig

          # 2️⃣ Merge Holi SoC
          scripts/kconfig/merge_config.sh -m \
            ${OUT_DIR}/.config \
            arch/arm64/configs/vendor/holi_GKI.config

          # 3️⃣ Merge device config
          scripts/kconfig/merge_config.sh -m \
            ${OUT_DIR}/.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-bangkk.config

          # 4️⃣ Désactiver complètement FTS (écran non compatible)
          sed -i \
            -e 's/^CONFIG_TOUCHSCREEN_FTS.*/# CONFIG_TOUCHSCREEN_FTS is not set/' \
            -e 's/^CONFIG_TOUCHSCREEN_FTS_V3.*/# CONFIG_TOUCHSCREEN_FTS_V3 is not set/' \
            ${OUT_DIR}/.config

          # 5️⃣ S'assurer que Goodix est bien activé
          sed -i \
            's/^# CONFIG_TOUCHSCREEN_GOODIX_BRL_MMI is not set/CONFIG_TOUCHSCREEN_GOODIX_BRL_MMI=m/' \
            ${OUT_DIR}/.config

          # 6️⃣ Désactivation KEYS / signatures (clang + GKI safe)
          cat >> ${OUT_DIR}/.config <<'EOF'
          # CONFIG_KEYS is not set
          # CONFIG_ASYMMETRIC_KEYS is not set
          # CONFIG_SYSTEM_TRUSTED_KEYRING is not set
          # CONFIG_SYSTEM_REVOCATION_KEYRING is not set
          # CONFIG_INTEGRITY_SIGNATURE is not set
          # CONFIG_MODULE_SIG is not set
          # CONFIG_MODULE_SIG_ALL is not set
          EOF

          # 7️⃣ Normalisation finale (OBLIGATOIRE)
          make O=${OUT_DIR} ARCH=${ARCH} olddefconfig

      - name: Verify final config
        run: |
          echo "==== TOUCHSCREEN ===="
          grep TOUCHSCREEN ${OUT_DIR}/.config || true
          echo "==== KEYS ===="
          grep KEYS ${OUT_DIR}/.config || true

      - name: Build kernel Image (GKI)
        run: |
          make -j$(nproc) \
            O=${OUT_DIR} \
            ARCH=${ARCH} \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

      - name: Verify output
        run: |
          ls -lh ${OUT_DIR}/arch/arm64/boot/Image
          file ${OUT_DIR}/arch/arm64/boot/Image

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gki-bangkk
          path: out/arch/arm64/boot/Image
