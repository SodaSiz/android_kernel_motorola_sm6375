name: Build GKI Kernel (bangkk / holi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      OUT_DIR: out
      LLVM: 1
      LLVM_IAS: 1
      CC: clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git gnupg \
            libssl-dev libelf-dev lld llvm clang \
            python3 unzip zip

      - name: Prepare clean output directory
        run: |
          make mrproper
          rm -rf ${OUT_DIR}
          mkdir -p ${OUT_DIR}



      - name: Generate kernel config (GKI + holi + bangkk)
        run: |
          make O=${OUT_DIR} ARCH=${ARCH} gki_defconfig

          KCONFIG_CONFIG=${OUT_DIR}/.config \
          scripts/kconfig/merge_config.sh -m \
            arch/arm64/configs/vendor/holi_GKI.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-bangkk.config

          # --- FIX CRITIQUE : éliminer KEYS / ASYMMETRIC_KEYS ---
          KCONFIG_CONFIG=${OUT_DIR}/.config \
          scripts/kconfig/merge_config.sh -d \
            CONFIG_KEYS \
            CONFIG_ASYMMETRIC_KEYS \
            CONFIG_SYSTEM_TRUSTED_KEYRING \
            CONFIG_SYSTEM_REVOCATION_KEYRING \
            CONFIG_INTEGRITY_SIGNATURE \
            CONFIG_MODULE_SIG \
            CONFIG_MODULE_SIG_ALL \
            CONFIG_SYSTEM_EXTRA_CERTIFICATE

          # Désactivation spécifique bangkk
          echo "CONFIG_TOUCHSCREEN_FTS_V3=n" >> ${OUT_DIR}/.config

          make O=${OUT_DIR} ARCH=${ARCH} olddefconfig

      - name: Build kernel (Image only)
        run: |
          make -j$(nproc) \
            O=${OUT_DIR} \
            ARCH=${ARCH} \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

      - name: Verify output
        run: |
          ls -lh ${OUT_DIR}/arch/arm64/boot/Image
          file ${OUT_DIR}/arch/arm64/boot/Image

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gki-bangkk
          path: |
            out/arch/arm64/boot/Image
