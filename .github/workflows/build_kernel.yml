name: Build GKI Kernel (bangkk / holi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      OUT_DIR: out
      LLVM: 1
      LLVM_IAS: 1
      CC: clang
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git gnupg \
            libssl-dev libelf-dev lld llvm clang \
            python3 unzip zip

      - name: Prepare clean output directory
        run: |
          make mrproper
          rm -rf ${OUT_DIR}
          mkdir -p ${OUT_DIR}
      

      - name: Verify KEYS config
        run: |
          grep -E "KEYS|ASYMMETRIC" ${OUT_DIR}/.config || true

      - name: Generate kernel config (GKI + holi + bangkk)
        run: |
          # 1) Base GKI dans OUT_DIR uniquement
          make O=${OUT_DIR} ARCH=${ARCH} gki_defconfig

          # 2) Merge holi + bangkk
          scripts/kconfig/merge_config.sh -m \
            ${OUT_DIR}/.config \
            arch/arm64/configs/vendor/holi_GKI.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-bangkk.config

          # 3) Désactivation KEYS (clang fix)
          cat > disable_keys.config <<'EOF'
          # CONFIG_KEYS is not set
          # CONFIG_ASYMMETRIC_KEYS is not set
          # CONFIG_SYSTEM_TRUSTED_KEYRING is not set
          # CONFIG_SYSTEM_REVOCATION_KEYRING is not set
          # CONFIG_INTEGRITY_SIGNATURE is not set
          # CONFIG_MODULE_SIG is not set
          # CONFIG_MODULE_SIG_ALL is not set
          # CONFIG_SYSTEM_EXTRA_CERTIFICATE is not set
          EOF

          scripts/kconfig/merge_config.sh -m \
            ${OUT_DIR}/.config \
            disable_keys.config

          # 4) Forcer écran Goodix (pas FTS)
          sed -i 's/CONFIG_TOUCHSCREEN_FTS_V3=m/# CONFIG_TOUCHSCREEN_FTS_V3 is not set/' ${OUT_DIR}/.config

          # 5) Normalisation finale
          make O=${OUT_DIR} ARCH=${ARCH} olddefconfig
          
                - name: Verify critical config
        run: |
          echo "==== KEYS ===="
          grep CONFIG_KEYS ${OUT_DIR}/.config || true
          echo "==== TOUCH ===="
          grep TOUCHSCREEN ${OUT_DIR}/.config || true


      - name: Build kernel (Image only)
        run: |
          make -j$(nproc) \
            O=${OUT_DIR} \
            ARCH=${ARCH} \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

      - name: Verify output
        run: |
          ls -lh ${OUT_DIR}/arch/arm64/boot/Image
          file ${OUT_DIR}/arch/arm64/boot/Image

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gki-bangkk
          path: |
            out/arch/arm64/boot/Image
